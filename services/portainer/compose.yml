services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_TAG:-lts}
    container_name: portainer
    restart: unless-stopped
    # Crea el usuario "admin" con la contraseña del secreto: evita el timeout de 5 min del setup inicial.
    command: --admin-password-file /run/secrets/portainer_admin_password
    ports:
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"   # HTTPS (certificado autofirmado)
      - "${PORTAINER_HTTP_PORT:-9000}:9000"    # HTTP (requerido por la guía)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    secrets:
      - portainer_admin_password
    networks:
      - red-interna
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    # Rotación de logs: máx. 3 archivos de 10 MB (30 MB por contenedor).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  portainer_admin_password:
    file: ../../secrets/portainer_admin_password.txt

volumes:
  portainer_data:

networks:
  red-interna:
    name: red-interna
    external: true
