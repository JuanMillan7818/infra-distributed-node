# Configuración mínima de Glances: lo no definido usa valores por defecto.
[global]
check_update=false

[fs]
# Oculta los bind mounts que Docker inyecta en el contenedor (mismo disco que /).
hide=/etc/.*,/glances/.*,/run/.*,/boot.*,/snap/.*

[network]
# Oculta loopback e interfaces virtuales de Docker.
hide=lo,docker.*,veth.*,br-.*

[diskio]
hide=loop.*,ram.*

[prometheus]
# 0.0.0.0 para que Prometheus (en red-interna) lo alcance vía host-gateway.
# El puerto 9091 NO debe abrirse en el Security Group de EC2.
host=0.0.0.0
port=9091
prefix=glances
labels=src:glances
