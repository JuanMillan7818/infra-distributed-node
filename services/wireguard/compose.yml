# Fase 4 - VPN WireGuard con panel web (wg-easy v15).
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:${WG_EASY_TAG:-15}
    container_name: wg-easy
    restart: unless-stopped
    # INIT_PASSWORD lo genera "manage init" (wg-easy exige 12+ caracteres con mayúscula,
    # minúscula, número y símbolo). required:false para que "manage config" funcione antes del init.
    env_file:
      - path: ../../secrets/wg-easy.env
        required: false
    environment:
      - TZ=America/Bogota
      # Setup desatendido: solo se aplica en el primer arranque (base de datos vacía).
      - INIT_ENABLED=true
      - INIT_USERNAME=admin
      - INIT_HOST=${SERVER_PUBLIC_IP:-127.0.0.1}   # Endpoint que reciben los clientes
      - INIT_PORT=${WG_PORT:-51820}
      - INIT_DNS=1.1.1.1,8.8.8.8
      - INIT_IPV4_CIDR=10.8.0.0/24
      # Split tunnel: el cliente solo enruta la VPN y red-interna; su internet sigue local.
      - INIT_ALLOWED_IPS=10.8.0.0/24,172.30.0.0/16
      - DISABLE_IPV6=true
      # Panel por HTTP: solo se publica en 127.0.0.1 y se usa a través de la VPN (10.8.0.1:51821).
      - INSECURE=true
    ports:
      - "${WG_PORT:-51820}:51820/udp"                     # Túnel: único puerto público
      - "127.0.0.1:${WG_UI_PORT:-51821}:51821/tcp"         # Panel web
    volumes:
      - wg_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - red-interna
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wg_data:

networks:
  red-interna:
    name: red-interna
    external: true
