services:
  # Servicio de Samba
  samba:
    image: dperson/samba
    container_name: ubuntu-samba
    environment:
      - WORKGROUP=WORKGROUP
      - SHARE=publico;/samba/shared;yes;no;yes;all;none
    # En Windows (local) 139/445 los ocupa el propio SMB del sistema: usar otros en .env.
    ports:
      - "${SAMBA_NETBIOS_PORT:-139}:139"
      - "${SAMBA_PORT:-445}:445"
    volumes:
      - samba_data:/samba/shared
    restart: unless-stopped
    networks:
      - red-interna
    # Rotación de logs: máx. 3 archivos de 10 MB (30 MB por contenedor).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  red-interna:
    name: red-interna
    external: true

volumes:
  samba_data: