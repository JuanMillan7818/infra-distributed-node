persistence true
persistence_location /mosquitto/data/
# Solo stdout: Docker rota los logs (logging en compose.yml). Ver con: manage logs mosquitto
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Autenticación obligatoria en todos los listeners. passwd y acl los genera
# config/start.sh al arrancar, a partir de los secretos de secrets/ (ver init.sh).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Puerto MQTT estándar por TCP (modo socket): Node-RED y clientes de la red interna/VPN.
listener 1883

# MQTT sobre WebSocket: la web de facturación (Vercel) publica por aquí.
# En Codespaces el proxy termina el TLS: wss://<codespace>-9001.app.github.dev
listener 9001
protocol websockets
