global:
  scrape_interval: 5s       # Casi tiempo real (Glances refresca cada 5 s)
  evaluation_interval: 15s

scrape_configs:
  - job_name: glances
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          host: servidor-ec2

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
